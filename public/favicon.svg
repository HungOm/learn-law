    <line x1="50" y1="26" x2="50" y2="76"/>
    <line x1="28" y1="38" x2="72" y2="38"/>
    <path d="M28 38 L20 60 h16 Z"/>
    <path d="M72 38 L64 60 h16 Z"/>
    <line x1="38" y1="76" x2="62" y2="76"/>
  </g>
</svg>
