<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) return a real
     number on a notched phone. Without it the insets are all 0, and a bottom
     navigation bar sits under the home indicator on every iPhone since the X —
     which is the hardware this audience is most likely to be holding. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ST's Chambers — Malaysian law, from zero</title>
<meta name="description" content="ST's Chambers: a self-directed curriculum in Malaysian law — lessons, spaced review, quizzes, case reading, guided writing and problem questions.">
<meta name="theme-color" content="#FCFBF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Fonts are self-hosted: see src/styles/fonts.css. No third-party origin, no
     render-blocking request, and the typography survives a first visit offline. -->
</head>
<body>
<div id="root"></div>
<!-- The entry lives here, not at the repository root, because the root is what
     GitHub Pages publishes: it holds the BUILT index.html and assets/. Vite's
     root is still the repository, so this path stays absolute from there. -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
