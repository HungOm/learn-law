# GitHub Pages needs a build step now that the app is a Vite bundle. The old
# "deploy from branch, root" setting will serve the source tree and a blank
# page — switch Settings → Pages → Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    # Both names deliberately: this repo's default branch was renamed from
    # main to master, and a workflow watching only the old name is a deploy
    # that silently never runs — the push succeeds, Actions shows nothing,
    # and the published site quietly stays several commits behind.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The content check runs before the build: a rubric that does not sum, or
      # a card no lesson plants, should fail here rather than ship.
      - run: python3 tools/check-content.py
      # Same argument one tier up: an extract with a citation that has no year,
      # or a quoted run long enough to be a reproduction, should fail here.
      - run: python3 tools/check-extracts.py
      - run: npm run build
      # Pages has two modes and the wrong one wins in silence. While the repo
      # is on "deploy from a branch", GitHub's own legacy builder publishes the
      # SOURCE tree — an index.html pointing at /src/main.jsx, which no browser
      # can execute — and every page of the published site is blank while the
      # URL still answers 200. This switches the source to Actions with the
      # token this job already holds, rather than depending on someone visiting
      # a settings page. Non-fatal: if the token is refused, say so plainly and
      # let the deploy step report the rest.
      # Plain curl against the REST API with the token this job already holds —
      # no CLI to install, authenticate or trust. 409 means it is already on
      # the Actions source, which is a success for our purposes.
      - name: Put Pages on the Actions source
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> $code"
          cat /tmp/pages.json || true
          if [ "$code" = "204" ] || [ "$code" = "200" ] || [ "$code" = "409" ]; then
            echo "Pages source is GitHub Actions."
          else
            echo "::warning::Could not switch the Pages source (HTTP $code). Set Settings -> Pages -> Source to 'GitHub Actions' by hand."
          fi

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on and sets its source to Actions if it is not already,
          # so a fresh clone of this repo deploys without anyone visiting the
          # settings page.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
