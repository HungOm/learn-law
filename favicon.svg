<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- ST Chambers: the registry chop. One geometry, three cuts — this is the
       MINIMAL cut (border and initials only), because a favicon renders at
       16-32px and the word "CHAMBERS" is 10 units on a 100-unit box, so it
       would land at 3.2px. The full cut, with the word, is on the level-up
       crest in Overlays.jsx at 112px; the medium cut is in the rail wordmark.
       See DESIGN.md — an SVG font-size in viewBox units is a ratio, not a size.

       Georgia rather than Spectral here on purpose: a favicon is parsed
       outside the app, where a webfont has not loaded and often cannot. Georgia
       is present on effectively every platform and holds its serif at 16px.
       Inside the app the same mark is set in Spectral. -->
  <rect width="100" height="100" rx="16" fill="#1B2A3A"/>
  <rect x="17" y="21" width="66" height="58" rx="2" fill="none" stroke="#ECC06B" stroke-width="6"/>
  <text x="50" y="63" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="40" font-weight="700" letter-spacing="-1.5" fill="#ECC06B">ST</text>
</svg>
